# Publishes public/ as a static site on GitHub Pages. Static hosting runs the app in
# this-device mode: one phone is the family's home base and other phones link to it.
# Turn it on in the repository's Settings → Pages → Source: GitHub Actions.
name: Deploy to GitHub Pages

# Runs on every push to main, or by hand (Actions → Deploy to GitHub Pages → Run workflow).
# Pages needs a public repository, or a paid plan for a private one.
on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 26
      - run: npm ci
      - run: npm test

  deploy:
    needs: test
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 26
      - run: npm ci
      - run: npm run vendor
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: public
      - id: deployment
        uses: actions/deploy-pages@v4
